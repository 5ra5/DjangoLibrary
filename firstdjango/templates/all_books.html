{% extends 'base.html' %}
{% block title %}
    <h3>All books</h3>
{% endblock %}

{% block content %}
    {% for b in books %}
        <div>
            <p>Title: <b> {{b.title}} </b></p>
            <p>Author: {{b.author}} </p>
            <p>Year: {{b.year}} </p>
            <p>Category: {{b.category}} </p>
            <p>Price: {{b.price}} euros</p>
            <p> {{b.synopsis}} </p>
            <br></br>
        </div>
    {% endfor %}
{% endblock %}
