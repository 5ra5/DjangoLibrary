{% extends 'base.html' %}
{% block title %}
    <h3>All books written in this year</h3>
{% endblock %}

{% block content %}
    {% for b in books_by_year %}
        <div>
            <p> {{b.title}} </p>
            <p> {{b.author}} </p>
            <p> {{b.year}} </p>
            <p> {{b.price}} </p>
            <p> {{b.synopsis}} </p>
        </div>
    {% endfor %}
{% endblock %}
