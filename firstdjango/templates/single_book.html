{% extends 'base.html' %}
{% block title %}
    <h3>{{book.title}}</h3>
{% endblock %}

{% block content %}
    <div>
        <p>Author: {{book.author}} </p>
        <p>Year: {{book.year}} </p>
        <p>Category: {{book.category}}</p>
        <p>Price: {{book.price}} euros</p>
        <p> {{book.synopsis}} </p>
    </div>
{% endblock %}
