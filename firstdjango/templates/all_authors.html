{% extends 'base.html' %}
{% block title %}
    <h3>All authors</h3>
{% endblock %}

{% block content %}
    {% for a in authors %}
        <div>
            <p>Name: <b> {{a.name}} </b></p>
            <p>Birth Year: {{a.birth_year}} </p>
            <p>Country: {{a.country}} </p>
            <br></br>
        </div>
    {% endfor %}
{% endblock %}
