{% extends 'base.html' %}
{% block title %}
    <h3>All books of this category</h3>
{% endblock %}

{% block content %}
    {% for c in category %}
        <div>
            <p>Title: <b> {{c.title}} </b></p>
            <p>Author: {{c.author}} </p>
            <p>Year: {{c.year}} </p>
            <p> Category: {{c.category}}</p>
            <p>Price: {{c.price}} euros</p>
            <p> {{c.synopsis}} </p>
            <br></br>
        </div>
    {% endfor %}
{% endblock %}
